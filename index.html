    function App() {
      const [logs, setLogs] = React.useState(() => {
        try {
          const saved = localStorage.getItem('jagdamba_logs');
          return saved ? JSON.parse(saved) : INITIAL_LOGS;
        } catch(e) {
          return INITIAL_LOGS;
        }
      });

      const [customers, setCustomers] = React.useState(() => {
        try {
          const saved = localStorage.getItem('jagdamba_customers');
          return saved ? JSON.parse(saved) : INITIAL_CUSTOMERS;
        } catch(e) {
          return INITIAL_CUSTOMERS;
        }
      });

      React.useEffect(() => {
        try {
          localStorage.setItem('jagdamba_logs', JSON.stringify(logs));
        } catch(e) {}
      }, [logs]);

      React.useEffect(() => {
        try {
          localStorage.setItem('jagdamba_customers', JSON.stringify(customers));
        } catch(e) {}
      }, [customers]);

      const [activeTab, setActiveTab] = React.useState('dashboard');
      
      const [filterCategory, setFilterCategory] = React.useState('all');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [customerSearch, setCustomerSearch] = React.useState('');
      const [selectedMonth, setSelectedMonth] = React.useState('2026-08');
      const [selectedSeedFilter, setSelectedSeedFilter] = React.useState('all');
      const [graphViewMode, setGraphViewMode] = React.useState('daily');
      const [activeHoverBar, setActiveHoverBar] = React.useState(null);
      
      const [activeModal, setActiveModal] = React.useState(null);
      const [prefilledCustomer, setPrefilledCustomer] = React.useState('');
      const [newlyAddedId, setNewlyAddedId] = React.useState(null);
      const [toastMsg, setToastMsg] = React.useState('');

      const inventory = React.useMemo(() => {
        let totalSeedKg = 48500;
        let totalOilLitres = 18200;
        let totalCakeKg = 24400;

        const seedBreakdown = {};
        OIL_SEEDS_LIST.forEach(s => {
          seedBreakdown[s.name] = { seedKg: 5000, oilLitres: 2000, cakeKg: 3000 };
        });

        logs.forEach(log => {
          if (log.category === 'seed_add') {
            totalSeedKg += Number(log.seedQtyKg || 0);
            if (seedBreakdown[log.seedType]) {
              seedBreakdown[log.seedType].seedKg += Number(log.seedQtyKg || 0);
            }
          }
          if (log.category === 'crushing') {
            totalSeedKg -= Number(log.seedQtyKg || 0);
            totalOilLitres += Number(log.oilProducedLitres || 0);
            totalCakeKg += Number(log.cakeProducedKg || 0);
            
            if (seedBreakdown[log.seedType]) {
              seedBreakdown[log.seedType].seedKg = Math.max(0, seedBreakdown[log.seedType].seedKg - Number(log.seedQtyKg || 0));
              seedBreakdown[log.seedType].oilLitres += Number(log.oilProducedLitres || 0);
              seedBreakdown[log.seedType].cakeKg += Number(log.cakeProducedKg || 0);
            }
          }
        });

        return { totalSeedKg, totalOilLitres, totalCakeKg, seedBreakdown };
      }, [logs]);

      const dailyGraphData = React.useMemo(() => {
        const [year, month] = selectedMonth.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();
        
        const days = Array.from({ length: daysInMonth }, (_, i) => {
          const dayNum = (i + 1).toString().padStart(2, '0');
          const dateStr = `${selectedMonth}-${dayNum}`;
          return {
            date: dateStr,
            dayLabel: `${i + 1}`,
            seedCrushedKg: 0,
            oilProducedLitres: 0,
            cakeProducedKg: 0,
            ordersAmount: 0,
            paymentsAmount: 0
          };
        });

        logs.forEach(log => {
          if (log.date && log.date.startsWith(selectedMonth)) {
            const dayIndex = parseInt(log.date.split('-')[2], 10) - 1;
            if (dayIndex >= 0 && dayIndex < daysInMonth) {
              if (log.category === 'crushing') {
                days[dayIndex].seedCrushedKg += Number(log.seedQtyKg || 0);
                days[dayIndex].oilProducedLitres += Number(log.oilProducedLitres || 0);
                days[dayIndex].cakeProducedKg += Number(log.cakeProducedKg || 0);
              }
              if (log.category === 'order') {
                days[dayIndex].ordersAmount += Number(log.amount || 0);
              }
              if (log.category === 'payment') {
                days[dayIndex].paymentsAmount += Number(log.amount || 0);
              }
            }
          }
        });

        return days;
      }, [logs, selectedMonth]);

      const monthlyGraphData = React.useMemo(() => {
        const monthsList = [
          { label: 'Mar 2026', key: '2026-03' },
          { label: 'Apr 2026', key: '2026-04' },
          { label: 'May 2026', key: '2026-05' },
          { label: 'Jun 2026', key: '2026-06' },
          { label: 'Jul 2026', key: '2026-07' },
          { label: 'Aug 2026', key: '2026-08' },
        ];

        return monthsList.map(m => {
          let seedCrushedKg = 0;
          let oilProducedLitres = 0;
          let ordersAmount = 0;
          let paymentsAmount = 0;

          logs.forEach(l => {
            if (l.date && l.date.startsWith(m.key)) {
              if (l.category === 'crushing') {
                seedCrushedKg += Number(l.seedQtyKg || 0);
                oilProducedLitres += Number(l.oilProducedLitres || 0);
              }
              if (l.category === 'order') ordersAmount += Number(l.amount || 0);
              if (l.category === 'payment') paymentsAmount += Number(l.amount || 0);
            }
          });

          return {
            ...m,
            seedCrushedTons: (seedCrushedKg / 1000).toFixed(1),
            oilProducedLitres,
            ordersAmount,
            paymentsAmount
          };
        });
      }, [logs]);

      const seedDistributionData = React.useMemo(() => {
        const breakdown = {};
        OIL_SEEDS_LIST.forEach(s => {
          breakdown[s.name] = { name: s.name, icon: s.icon, seedCrushedKg: 0, oilProducedLitres: 0 };
        });

        logs.forEach(l => {
          if (l.category === 'crushing' && breakdown[l.seedType]) {
            breakdown[l.seedType].seedCrushedKg += Number(l.seedQtyKg || 0);
            breakdown[l.seedType].oilProducedLitres += Number(l.oilProducedLitres || 0);
          }
        });

        return Object.values(breakdown);
      }, [logs]);

      const monthlyMetrics = React.useMemo(() => {
        const monthLogs = logs.filter(l => l.date && l.date.startsWith(selectedMonth));
        
        let seedAdded = 0;
        let seedCrushed = 0;
        let oilProduced = 0;
        let cakeProduced = 0;
        let ordersValue = 0;
        let paymentsCollected = 0;

        monthLogs.forEach(l => {
          if (l.category === 'seed_add') seedAdded += Number(l.seedQtyKg || 0);
          if (l.category === 'crushing') {
            seedCrushed += Number(l.seedQtyKg || 0);
            oilProduced += Number(l.oilProducedLitres || 0);
            cakeProduced += Number(l.cakeProducedKg || 0);
          }
          if (l.category === 'order') ordersValue += Number(l.amount || 0);
          if (l.category === 'payment') paymentsCollected += Number(l.amount || 0);
        });

        const extractionRate = seedCrushed > 0 ? ((oilProduced / seedCrushed) * 100).toFixed(1) : '0.0';

        return {
          seedAdded,
          seedCrushed,
          oilProduced,
          cakeProduced,
          ordersValue,
          paymentsCollected,
          extractionRate,
          totalEntries: monthLogs.length
        };
      }, [logs, selectedMonth]);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const handleAddSeed = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newLog = {
          id: 'LOG-' + (Math.floor(1000 + Math.random() * 9000)),
          date: fd.get('date'),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          type: 'Seed Addition',
          category: 'seed_add',
          seedType: fd.get('seedType'),
          supplier: fd.get('supplier'),
          seedQtyKg: Number(fd.get('seedQtyKg')),
          costPerTon: Number(fd.get('costPerTon') || 0),
          amount: (Number(fd.get('seedQtyKg')) / 1000) * Number(fd.get('costPerTon') || 0),
          operator: fd.get('operator') || 'Yard Staff'
        };

        setLogs([newLog, ...logs]);
        setNewlyAddedId(newLog.id);
        setActiveModal(null);
        triggerToast('🌾 Seed stock addition logged successfully!');
      };

      const handleLogCrushing = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newLog = {
          id: 'LOG-' + (Math.floor(1000 + Math.random() * 9000)),
          date: fd.get('date'),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          type: 'Crushing',
          category: 'crushing',
          seedType: fd.get('seedType'),
          seedQtyKg: Number(fd.get('seedQtyKg')),
          oilProducedLitres: Number(fd.get('oilProducedLitres')),
          cakeProducedKg: Number(fd.get('cakeProducedKg')),
          operator: fd.get('operator') || 'Mill Supervisor',
          notes: fd.get('notes') || 'Daily shift crushing run'
        };

        setLogs([newLog, ...logs]);
        setNewlyAddedId(newLog.id);
        setActiveModal(null);
        triggerToast('⚙️ Daily Crushing & Oil Output recorded!');
      };

      const handleNewOrder = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const custName = fd.get('customerName');

                  <form onSubmit={handleNewOrder} className="space-y-4 text-xs">
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Order Date</label>
                      <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Select Customer</label>
                      <select name="customerName" defaultValue={prefilledCustomer || customers[0]?.name} className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300">
                        {customers.map(c => (
                          <option key={c.id} value={c.name}>{c.name} ({c.contact})</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Product Description</label>
                      <select name="product" className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300">
                        <option value="Filtered Groundnut Oil (15L Tin)">Filtered Groundnut Oil (15L Tin)</option>
                        <option value="Sunflower Oil (15L Tin)">Sunflower Oil (15L Tin)</option>
                        <option value="Safflower Oil / Kardai Oil (15L Tin)">Safflower Oil / Kardai Oil (15L Tin)</option>
                        <option value="Cold Pressed Sesame Oil (15L Tin)">Cold Pressed Sesame Oil (15L Tin)</option>
                        <option value="Mustard Oil (15L Tin)">Mustard Oil (15L Tin)</option>
                        <option value="Pure Coconut Oil (15L Tin)">Pure Coconut Oil (15L Tin)</option>
                        <option value="Flaxseed Oil / Jawas Oil (15L Tin)">Flaxseed Oil / Jawas Oil (15L Tin)</option>
                        <option value="De-oiled Oilseed Cake (50Kg Bag)">De-oiled Oilseed Cake (50Kg Bag)</option>
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-semibold text-stone-600 mb-1">Quantity/Units</label>
                        <input type="text" name="qty" placeholder="50 Tins / 2 Tons" required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                      </div>
                      <div>
                        <label className="block font-semibold text-stone-600 mb-1">Total Amount (₹)</label>
                        <input type="number" name="amount" placeholder="95000" required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                      </div>
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Sales Rep Name</label>
                      <input type="text" name="operator" defaultValue="Sales Desk" className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                    </div>
                    <div className="flex items-center space-x-3 pt-2">
                      <button 
                        type="button" 
                        onClick={() => setActiveModal(null)} 
                        className="w-1/2 py-3 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl font-bold transition-all"
                      >
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        className="w-1/2 py-3 bg-sage-600 hover:bg-sage-700 text-white rounded-xl font-bold shadow-sm transition-all"
                      >
                        Log Order Entry
                      </button>
                    </div>
                  </form>
                )}

                {activeModal === 'log_payment' && (
                  <form onSubmit={handleLogPayment} className="space-y-4 text-xs">
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Payment Date</label>
                      <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Select Customer</label>
                      <select name="customerName" defaultValue={prefilledCustomer || customers[0]?.name} className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300">
                        {customers.map(c => (
                          <option key={c.id} value={c.name}>{c.name} (Bal: ₹{c.balance.toLocaleString()})</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Amount Received (₹)</label>
                      <input type="number" name="amount" placeholder="50000" required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Payment Mode</label>
                      <select name="mode" className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300">
                        <option value="Bank Transfer (NEFT/RTGS)">Bank Transfer (NEFT/RTGS)</option>
                        <option value="UPI / QR Payment">UPI / QR Payment</option>
                        <option value="Cheque Deposit">Cheque Deposit</option>
                        <option value="Cash">Cash Receipt</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Bank Reference No. / UTR</label>
                      <input type="text" name="refNo" placeholder="UTIBR2026..." className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                    </div>
                    <div className="flex items-center space-x-3 pt-2">
                      <button 
                        type="button" 
                        onClick={() => setActiveModal(null)} 
                        className="w-1/2 py-3 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl font-bold transition-all"
                      >
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        className="w-1/2 py-3 bg-sage-600 hover:bg-sage-700 text-white rounded-xl font-bold shadow-sm transition-all"
                      >
                        Record Payment
                      </button>
                    </div>
                  </form>
                )}

                {activeModal === 'add_customer' && (
                  <form onSubmit={handleAddCustomer} className="space-y-4 text-xs">
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Company / Customer Name</label>
                      <input type="text" name="name" placeholder="Apex Supermarket Ltd" required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-semibold text-stone-600 mb-1">Contact Person</label>
                        <input type="text" name="contact" placeholder="Rahul Varma" required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                      </div>
                      <div>
                        <label className="block font-semibold text-stone-600 mb-1">Phone Number</label>
                        <input type="text" name="phone" placeholder="+91 98220..." required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                      </div>
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Email Address</label>
                      <input type="email" name="email" placeholder="contact@company.com" className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                    </div>
                    <div>
                      <label className="block font-semibold text-stone-600 mb-1">Address / Location</label>
                      <input type="text" name="address" placeholder="Industrial Area, City" required className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-semibold text-stone-600 mb-1">Opening Balance (₹)</label>
                        <input type="number" name="openingBalance" defaultValue="0" className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                      </div>
                      <div>
                        <label className="block font-semibold text-stone-600 mb-1">Approved Credit Limit (₹)</label>
                        <input type="number" name="creditLimit" defaultValue="100000" className="w-full p-2.5 bg-offwhite border border-offwhiteBorder rounded-xl focus:outline-none focus:ring-2 focus:ring-sage-300" />
                      </div>
                    </div>
                    <div className="flex items-center space-x-3 pt-2">
                      <button 
                        type="button" 
                        onClick={() => setActiveModal(null)} 
                        className="w-1/2 py-3 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl font-bold transition-all"
                      >
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        className="w-1/2 py-3 bg-sage-600 hover:bg-sage-700 text-white rounded-xl font-bold shadow-sm transition-all"
                      >
                        Add Customer
                      </button>
                    </div>
                  </form>
                )}

              </div>
            </div>
          )}

          <footer className="mt-auto py-6 border-t border-offwhiteBorder text-center text-xs text-stone-400">
            <p>SHRI JAGDAMBA IND Daily Operations Monitor • Designed for Edible Oil Extraction & Processing Units</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
