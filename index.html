<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- ⚡ INLINE DATA-URI MANIFEST (Bypasses network delays and guarantees 100% PWABuilder detection) -->
  <link rel="manifest" href='data:application/manifest+json,{"id":"/","short_name":"Shri Jagdamba","name":"Shri Jagdamba Industry - Edible Oil Mill Daily Monitor","description":"Daily operational tracking for oilseed crushing, inventory, orders, and payments.","icons":[{"src":"https://img.icons8.com/color/192/factory.png","type":"image/png","sizes":"192x192","purpose":"any maskable"},{"src":"https://img.icons8.com/color/512/factory.png","type":"image/png","sizes":"512x512","purpose":"any maskable"}],"start_url":"/","background_color":"#FAF9F5","theme_color":"#4F6C47","display":"standalone","orientation":"portrait-primary","scope":"/"}' />
  
  <!-- Standard Manifest Fallback -->
  <link rel="manifest" href="/manifest.json" />

  <title>SHRI JAGDAMBA IND - Edible Oil Mill Daily Operations Monitor</title>
  
  <meta name="theme-color" content="#4F6C47" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="Shri Jagdamba" />
  <link rel="icon" sizes="192x192" href="https://img.icons8.com/color/192/factory.png" />

  <!-- Immediate Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) {
          console.log('SW registration note:', err);
        });
      });
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Custom Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            offwhite: '#FAF9F5',
            offwhiteCard: '#FFFFFF',
            offwhiteBorder: '#E9E7DF',
            sage: {
              50: '#F4F7F3', 100: '#E4ECE1', 200: '#C7D7C1', 300: '#A3BD9B',
              400: '#83A37A', 500: '#64855B', 600: '#4F6C47', 700: '#3D5337',
              800: '#2C3C28', 900: '#1B2519',
            },
            bark: { 500: '#4A463D', 800: '#23211C' }
          },
          boxShadow: {
            'soft-sm': '0 2px 8px -2px rgba(40, 50, 35, 0.04)',
            'soft': '0 4px 20px -4px rgba(40, 50, 35, 0.06)',
            'soft-lg': '0 12px 32px -6px rgba(30, 40, 25, 0.08)',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #FAF9F5; color: #23211C; font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes entryFadeIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-entry-fade { animation: entryFadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen selection:bg-sage-200">
  <div id="root"></div>

  <script>
    const e = React.createElement;

    function Logo() {
      return e('svg', { className: 'h-10 w-auto', viewBox: '0 0 380 120', fill: 'none', xmlns: 'http://www.w3.org/2000/svg' },
        e('polygon', { points: '98,8 108,18 98,28 88,18', fill: '#E52320' }),
        e('polygon', { points: '98,8 108,18 98,20 88,18', fill: '#FF5252' }),
        e('path', { d: 'M 68 35 C 75 18, 52 10, 32 20 C 12 30, 8 52, 26 65 C 48 80, 78 88, 55 106 C 36 120, 10 108, 18 92', stroke: '#E52320', strokeWidth: 12, strokeLinecap: 'round', fill: 'none' }),
        e('path', { d: 'M 98 28 L 98 90 C 98 112, 60 120, 30 110', stroke: '#E52320', strokeWidth: 12, strokeLinecap: 'round', fill: 'none' }),
        e('circle', { cx: 98, cy: 55, r: 5, fill: '#E52320' }),
        e('text', { x: 135, y: 55, fontFamily: 'serif', fontSize: 32, fontWeight: '800', fill: '#E52320', letterSpacing: '0.5' }, 'Shri Jagdamba'),
        e('line', { x1: 135, y1: 78, x2: 182, y2: 78, stroke: '#111', strokeWidth: 5, strokeLinecap: 'round' }),
        e('text', { x: 190, y: 86, fontFamily: 'sans-serif', fontSize: 28, fontWeight: '800', fill: '#111', letterSpacing: '0.5' }, 'Industry'),
        e('line', { x1: 315, y1: 78, x2: 362, y2: 78, stroke: '#111', strokeWidth: 5, strokeLinecap: 'round' })
      );
    }

    const OIL_SEEDS = [
      { id: 'groundnut', name: 'Groundnut (Peanut)', icon: '🥜' },
      { id: 'sunflower', name: 'Sunflower Seed', icon: '🌻' },
      { id: 'safflower', name: 'Safflower (Kardai)', icon: '🌼' },
      { id: 'sesame', name: 'Sesame Seed (Til)', icon: '🌱' },
      { id: 'mustard', name: 'Mustard Seed', icon: '🌾' },
      { id: 'coconut', name: 'Coconut (Copra)', icon: '🥥' },
      { id: 'flaxseed', name: 'Flaxseed (Jawas)', icon: '🌿' }
    ];

    const INITIAL_CUSTOMERS = [
      { id: 'CUST-101', name: 'Apex Foods Ltd', contact: 'Rajesh Sharma', phone: '+91 98230 44110', balance: 45000 },
      { id: 'CUST-102', name: 'Golden Spoon Bakery', contact: 'Meera Patel', phone: '+91 97112 88320', balance: 0 },
      { id: 'CUST-103', name: 'Standard Wholesalers', contact: 'Anil Agarwal', phone: '+91 94220 11299', balance: 128000 }
    ];

    const INITIAL_LOGS = [
      { id: 'LOG-1020', date: '2026-08-22', type: 'Crushing', seedType: 'Groundnut (Peanut)', seedQtyKg: 5000, oilProducedLitres: 2000, cakeProducedKg: 2900, operator: 'Suresh Kumar' },
      { id: 'LOG-1019', date: '2026-08-22', type: 'Order Received', customerName: 'Apex Foods Ltd', product: 'Filtered Groundnut Oil (15L Tin)', amount: 195000, operator: 'Amit (Sales)' },
      { id: 'LOG-1018', date: '2026-08-21', type: 'Payment Received', customerName: 'Golden Spoon Bakery', amount: 85000, operator: 'Accounts' }
    ];

    function App() {
      const [logs, setLogs] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('jagdamba_logs')) || INITIAL_LOGS; } catch(e) { return INITIAL_LOGS; }
      });

      const [customers, setCustomers] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('jagdamba_customers')) || INITIAL_CUSTOMERS; } catch(e) { return INITIAL_CUSTOMERS; }
      });

      const [activeTab, setActiveTab] = React.useState('dashboard');

      React.useEffect(() => {
        try { localStorage.setItem('jagdamba_logs', JSON.stringify(logs)); } catch(e){}
      }, [logs]);

      React.useEffect(() => {
        try { localStorage.setItem('jagdamba_customers', JSON.stringify(customers)); } catch(e){}
      }, [customers]);

      const totalOil = logs.reduce((sum, l) => sum + Number(l.oilProducedLitres || 0), 18200);
      const totalSeed = logs.reduce((sum, l) => sum + Number(l.seedQtyKg || 0), 48500);

      return e('div', { className: 'min-h-screen flex flex-col pb-12' },
        e('header', { className: 'bg-white border-b border-offwhiteBorder sticky top-0 z-30 shadow-soft-sm px-4 py-3' },
          e('div', { className: 'max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-4' },
            e('div', { className: 'flex items-center space-x-3' },
              e(Logo),
              e('div', { className: 'hidden sm:block border-l border-stone-200 pl-3' },
                e('h1', { className: 'text-sm font-extrabold text-bark-800 uppercase' }, 'SHRI JAGDAMBA IND'),
                e('p', { className: 'text-[11px] text-stone-500' }, 'Edible Oil Mill Daily Operations Monitor')
              )
            ),
            e('nav', { className: 'flex space-x-1 bg-offwhite p-1 rounded-2xl border border-offwhiteBorder text-xs font-semibold' },
              e('button', { onClick: () => setActiveTab('dashboard'), className: `px-4 py-2 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-white text-sage-800 shadow-soft font-bold' : 'text-stone-600'}` }, 'Dashboard'),
              e('button', { onClick: () => setActiveTab('logs'), className: `px-4 py-2 rounded-xl transition-all ${activeTab === 'logs' ? 'bg-white text-sage-800 shadow-soft font-bold' : 'text-stone-600'}` }, 'Daily Logs (' + logs.length + ')'),
              e('button', { onClick: () => setActiveTab('customers'), className: `px-4 py-2 rounded-xl transition-all ${activeTab === 'customers' ? 'bg-white text-sage-800 shadow-soft font-bold' : 'text-stone-600'}` }, 'Buyers Directory')
            )
          )
        ),
        e('main', { className: 'max-w-7xl mx-auto px-4 pt-6 space-y-6 flex-grow w-full' },
          activeTab === 'dashboard' && e('div', { className: 'space-y-6 animate-entry-fade' },
            e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4' },
              e('div', { className: 'bg-white p-5 rounded-3xl border border-offwhiteBorder shadow-soft' },
                e('div', { className: 'text-xs font-bold text-stone-400 uppercase' }, 'Raw Seed Inventory'),
                e('div', { className: 'text-2xl font-bold text-bark-800 mt-1' }, (totalSeed / 1000).toFixed(2), e('span', { className: 'text-xs font-normal text-stone-500 ml-1' }, 'Metric Tons')),
                e('div', { className: 'w-full bg-stone-100 h-2 rounded-full mt-3 overflow-hidden' },
                  e('div', { className: 'bg-sage-600 h-full rounded-full', style: { width: '65%' } })
                )
              ),
              e('div', { className: 'bg-white p-5 rounded-3xl border border-offwhiteBorder shadow-soft' },
                e('div', { className: 'text-xs font-bold text-stone-400 uppercase' }, 'Extracted Oil Tank Stock'),
                e('div', { className: 'text-2xl font-bold text-bark-800 mt-1' }, totalOil.toLocaleString(), e('span', { className: 'text-xs font-normal text-stone-500 ml-1' }, 'Litres')),
                e('div', { className: 'w-full bg-stone-100 h-2 rounded-full mt-3 overflow-hidden' },
                  e('div', { className: 'bg-amber-500 h-full rounded-full', style: { width: '52%' } })
                )
              ),
              e('div', { className: 'bg-white p-5 rounded-3xl border border-offwhiteBorder shadow-soft' },
                e('div', { className: 'text-xs font-bold text-stone-400 uppercase' }, 'Active Buyers'),
                e('div', { className: 'text-2xl font-bold text-bark-800 mt-1' }, customers.length, e('span', { className: 'text-xs font-normal text-stone-500 ml-1' }, 'Registered Clients')),
                e('div', { className: 'w-full bg-stone-100 h-2 rounded-full mt-3 overflow-hidden' },
                  e('div', { className: 'bg-blue-500 h-full rounded-full', style: { width: '80%' } })
                )
              )
            ),
            e('div', { className: 'bg-white p-6 rounded-3xl border border-offwhiteBorder shadow-soft space-y-4' },
              e('h3', { className: 'text-base font-bold text-bark-800' }, 'Processed Seed Varieties'),
              e('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-3 text-xs' },
                OIL_SEEDS.map(s => e('div', { key: s.id, className: 'p-3 bg-offwhite rounded-2xl border border-stone-200 flex items-center space-x-2' },
                  e('span', { className: 'text-xl' }, s.icon),
                  e('span', { className: 'font-semibold text-stone-700' }, s.name)
                ))
              )
            )
          ),
          activeTab === 'logs' && e('div', { className: 'bg-white p-6 rounded-3xl border border-offwhiteBorder shadow-soft space-y-4 animate-entry-fade' },
            e('h3', { className: 'text-base font-bold text-bark-800' }, 'Daily Operational Log Records'),
            e('div', { className: 'overflow-x-auto' },
              e('table', { className: 'w-full text-left text-xs' },
                e('thead', { className: 'bg-offwhite border-b text-stone-500 font-bold uppercase text-[10px]' },
                  e('tr', null,
                    e('th', { className: 'p-3' }, 'ID / Date'),
                    e('th', { className: 'p-3' }, 'Type'),
                    e('th', { className: 'p-3' }, 'Details'),
                    e('th', { className: 'p-3' }, 'Output / Amount'),
                    e('th', { className: 'p-3' }, 'Operator')
                  )
                ),
                e('tbody', { className: 'divide-y' },
                  logs.map(l => e('tr', { key: l.id },
                    e('td', { className: 'p-3 font-semibold' }, l.id, e('div', { className: 'text-[10px] text-stone-400 font-normal' }, l.date)),
                    e('td', { className: 'p-3 font-bold text-sage-700' }, l.type),
                    e('td', { className: 'p-3 text-stone-600' }, l.seedType || l.customerName || l.product || '—'),
                    e('td', { className: 'p-3 font-semibold' }, l.oilProducedLitres ? l.oilProducedLitres + ' L Oil' : l.amount ? '₹' + l.amount.toLocaleString() : '—'),
                    e('td', { className: 'p-3 text-stone-500' }, l.operator)
                  ))
                )
              )
            )
          ),
          activeTab === 'customers' && e('div', { className: 'bg-white p-6 rounded-3xl border border-offwhiteBorder shadow-soft space-y-4 animate-entry-fade' },
            e('h3', { className: 'text-base font-bold text-bark-800' }, 'Client & Buyer Directory'),
            e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              customers.map(c => e('div', { key: c.id, className: 'p-4 rounded-2xl bg-offwhite border border-stone-200 space-y-2' },
                e('div', { className: 'flex justify-between items-center' },
                  e('h4', { className: 'font-bold text-sm text-bark-800' }, c.name),
                  e('span', { className: 'text-xs font-bold px-2.5 py-1 rounded-xl bg-amber-100 text-amber-800' }, 'Bal: ₹' + c.balance.toLocaleString())
                ),
                e('p', { className: 'text-xs text-stone-500' }, c.contact + ' • ' + c.phone)
              ))
            )
          )
        ),
        e('footer', { className: 'mt-auto pt-6 text-center text-xs text-stone-400' },
          'SHRI JAGDAMBA IND Daily Operations Monitor • Ready for Android APK Packaging'
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
