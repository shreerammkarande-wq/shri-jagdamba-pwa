<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shri Jagdamba Industry - Daily Monitor</title>

  <!-- PWA & Mobile Optimization -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4F6C47" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Shri Jagdamba" />

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF9F5;
      color: #1F2937;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Custom Scrollbar for Smooth UI */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1EFEA;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Modal Fade-In Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <!-- Service Worker Registration for PWA Support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(
          (registration) => { console.log('PWA ServiceWorker registered'); },
          (err) => { console.log('ServiceWorker registration failed: ', err); }
        );
      });
    }
  </script>
</head>
<body class="min-h-screen bg-[#FAF9F5] text-slate-800 antialiased selection:bg-[#4F6C47]/20 selection:text-[#4F6C47]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Custom Shri Jagdamba Industry Brand Monogram & Logo
    const Logo = () => (
      <svg className="h-10 md:h-12 w-auto" viewBox="0 0 360 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        {/* Multi-Faceted Red Diamond Gem on top of J stem */}
        <g id="diamond-gem">
          <polygon points="90,4 102,14 78,14" fill="#FF6B6B" />
          <polygon points="78,14 102,14 90,26" fill="#E52320" />
          <polygon points="68,14 78,14 90,26" fill="#C41815" />
          <polygon points="102,14 112,14 90,26" fill="#990000" />
          <polygon points="68,14 78,14 90,4" fill="#E52320" />
          <polygon points="102,14 112,14 90,4" fill="#FF5252" />
        </g>
        
        {/* Interlocking 'S' and 'J' Monogram */}
        <path d="M 62 38 C 72 20, 48 12, 28 22 C 8 32, 4 56, 24 70 C 48 86, 76 92, 52 110 C 34 122, 10 110, 18 94" stroke="#E52320" strokeWidth="11" strokeLinecap="round" fill="none"/>
        <path d="M 90 26 L 90 88 C 90 110, 52 118, 24 106" stroke="#E52320" strokeWidth="11" strokeLinecap="round" fill="none"/>
        
        {/* Center Accent Dot on J Stem */}
        <circle cx="90" cy="56" r="6" fill="#E52320" />
        <circle cx="90" cy="56" r="2.5" fill="#FFFFFF" />
        
        {/* Brand Name Typography */}
        <text x="125" y="54" fontFamily="'Plus Jakarta Sans', Georgia, serif" fontSize="33" fontWeight="800" fill="#E52320" letterSpacing="0.2">Shri Jagdamba</text>
        
        {/* Industry Sub-text flanked by side lines */}
        <line x1="125" y1="78" x2="168" y2="78" stroke="#111111" strokeWidth="5" strokeLinecap="round" />
        <text x="176" y="86" fontFamily="'Plus Jakarta Sans', sans-serif" fontSize="26" fontWeight="800" fill="#111111" letterSpacing="0.8">Industry</text>
        <line x1="304" y1="78" x2="347" y2="78" stroke="#111111" strokeWidth="5" strokeLinecap="round" />
      </svg>
    );

    const Icons = {
      LayoutDashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>,
      ClipboardList: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>,
      Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      TrendingUp: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>,
      Droplets: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>,
      Package: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>,
      DollarSign: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V6m0 12v-2m0 0c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
      Phone: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>,
      MapPin: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      BarChart2: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 20V10m-6 10V4M6 20v-6"/></svg>,
      PieChart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
    };

    const OIL_SEEDS_LIST = [
      'Groundnut',
      'Sunflower',
      'Safflower',
      'Sesame',
      'Mustard',
      'Coconut',
      'Flaxseed'
    ];

    const PRODUCT_CATALOGUE = {
      'Groundnut': ['Groundnut Oil (Loose Oil)', 'Groundnut Oil (5 ltr)', 'Groundnut Oil (1 ltr)', 'Groundnut Oil (500 ml)', 'Groundnut Oil (200 ml)', 'Groundnut Oil (100 ml)', 'Groundnut Cake (50Kg Bag)', 'Groundnut Cake (Loose)'],
      'Sunflower': ['Sunflower Oil (Loose Oil)', 'Sunflower Oil (5 ltr)', 'Sunflower Oil (1 ltr)', 'Sunflower Oil (500 ml)', 'Sunflower Oil (200 ml)', 'Sunflower Oil (100 ml)', 'Sunflower Cake (50Kg Bag)', 'Sunflower Cake (Loose)'],
      'Safflower': ['Safflower Oil (Loose Oil)', 'Safflower Oil (5 ltr)', 'Safflower Oil (1 ltr)', 'Safflower Oil (500 ml)', 'Safflower Oil (200 ml)', 'Safflower Oil (100 ml)', 'Safflower Cake (50Kg Bag)', 'Safflower Cake (Loose)'],
      'Sesame': ['Sesame Oil (Loose Oil)', 'Sesame Oil (5 ltr)', 'Sesame Oil (1 ltr)', 'Sesame Oil (500 ml)', 'Sesame Oil (200 ml)', 'Sesame Oil (100 ml)', 'Sesame Cake (50Kg Bag)', 'Sesame Cake (Loose)'],
      'Mustard': ['Mustard Oil (Loose Oil)', 'Mustard Oil (5 ltr)', 'Mustard Oil (1 ltr)', 'Mustard Oil (500 ml)', 'Mustard Oil (200 ml)', 'Mustard Oil (100 ml)', 'Mustard Cake (50Kg Bag)', 'Mustard Cake (Loose)'],
      'Coconut': ['Coconut Oil (Loose Oil)', 'Coconut Oil (5 ltr)', 'Coconut Oil (1 ltr)', 'Coconut Oil (500 ml)', 'Coconut Oil (200 ml)', 'Coconut Oil (100 ml)', 'Coconut Cake (50Kg Bag)', 'Coconut Cake (Loose)'],
      'Flaxseed': ['Flaxseed Oil (Loose Oil)', 'Flaxseed Oil (5 ltr)', 'Flaxseed Oil (1 ltr)', 'Flaxseed Oil (500 ml)', 'Flaxseed Oil (200 ml)', 'Flaxseed Oil (100 ml)', 'Flaxseed Cake (50Kg Bag)', 'Flaxseed Cake (Loose)']
    };

    // Starting Fresh with empty arrays for production inputs
    const INITIAL_CUSTOMERS = [];
    const INITIAL_LOGS = [];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [logs, setLogs] = useState(INITIAL_LOGS);
      const [customers, setCustomers] = useState(INITIAL_CUSTOMERS);
      const [activeModal, setActiveModal] = useState(null);
      const [prefilledCustomer, setPrefilledCustomer] = useState('');

      // Filter & Graph Controls
      const [logCategoryFilter, setLogCategoryFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMonth, setSelectedMonth] = useState('2026-08');
      const [graphViewMode, setGraphViewMode] = useState('daily');

      const totals = useMemo(() => {
        let seedAdded = 0;
        let seedCrushed = 0;
        let oilProduced = 0; // Litres
        let cakeProduced = 0; // Kg
        let totalSales = 0; // Revenue
        let paymentsCollected = 0;

        logs.forEach(log => {
          if (log.type === 'SEED_ADD') seedAdded += Number(log.quantityKg || 0);
          if (log.type === 'CRUSHING') {
            seedCrushed += Number(log.seedCrushedKg || 0);
            oilProduced += Number(log.oilProducedLtr || 0);
            cakeProduced += Number(log.cakeProducedKg || 0);
          }
          if (log.type === 'ORDER') totalSales += Number(log.totalAmount || 0);
          if (log.type === 'PAYMENT') paymentsCollected += Number(log.amountPaid || 0);
        });

        const currentSeedStockTons = Math.max(0, (seedAdded - seedCrushed) / 1000);
        const totalReceivables = customers.reduce((acc, c) => acc + (c.outstandingBalance || 0), 0);

        return {
          seedAdded,
          seedCrushed,
          oilProduced,
          cakeProduced,
          totalSales,
          paymentsCollected,
          currentSeedStockTons,
          totalReceivables
        };
      }, [logs, customers]);

      const dailyGraphData = useMemo(() => {
        const daysInMonth = 31;
        const daysMap = {};
        for (let i = 1; i <= daysInMonth; i++) {
          const dayStr = String(i).padStart(2, '0');
          daysMap[`${selectedMonth}-${dayStr}`] = { day: i, crushed: 0, oil: 0, sales: 0, payments: 0 };
        }

        logs.forEach(log => {
          if (log.date && log.date.startsWith(selectedMonth)) {
            if (!daysMap[log.date]) {
              const dayNum = parseInt(log.date.split('-')[2]) || 1;
              daysMap[log.date] = { day: dayNum, crushed: 0, oil: 0, sales: 0, payments: 0 };
            }
            if (log.type === 'CRUSHING') {
              daysMap[log.date].crushed += Number(log.seedCrushedKg || 0);
              daysMap[log.date].oil += Number(log.oilProducedLtr || 0);
            }
            if (log.type === 'ORDER') {
              daysMap[log.date].sales += Number(log.totalAmount || 0);
            }
            if (log.type === 'PAYMENT') {
              daysMap[log.date].payments += Number(log.amountPaid || 0);
            }
          }
        });

        return Object.values(daysMap).sort((a, b) => a.day - b.day);
      }, [logs, selectedMonth]);

      // Seed Variety Breakdown Data
      const seedVarietyData = useMemo(() => {
        const seedMap = {};
        OIL_SEEDS_LIST.forEach(s => seedMap[s] = 0);
        logs.forEach(log => {
          if (log.type === 'CRUSHING' && log.seedType) {
            seedMap[log.seedType] = (seedMap[log.seedType] || 0) + Number(log.seedCrushedKg || 0);
          }
        });
        return Object.entries(seedMap).map(([name, crushed]) => ({ name, crushed }));
      }, [logs]);

      const handleAddLog = (newLog) => {
        setLogs(prev => [newLog, ...prev]);
        setActiveModal(null);
      };

      const handleAddCustomer = (newCustomer) => {
        setCustomers(prev => [...prev, newCustomer]);
        setActiveModal(null);
      };

      const handleOpenOrderModal = (customerName = '') => {
        setPrefilledCustomer(customerName);
        setActiveModal('ORDER');
      };

      const handleOpenPaymentModal = (customerName = '') => {
        setPrefilledCustomer(customerName);
        setActiveModal('PAYMENT');
      };

      return (
        <div className="min-h-screen flex flex-col pb-12">
          {/* Header Bar */}
          <header className="bg-white border-b border-slate-200/80 sticky top-0 z-20 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <Logo />
              </div>

              {/* Navigation Tabs */}
              <nav className="flex space-x-1 md:space-x-2 bg-[#FAF9F5] p-1.5 rounded-xl border border-slate-200/60">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-all ${
                    activeTab === 'dashboard'
                      ? 'bg-[#4F6C47] text-white shadow-sm'
                      : 'text-slate-600 hover:text-slate-900 hover:bg-white/60'
                  }`}
                >
                  <Icons.LayoutDashboard />
                  <span className="hidden sm:inline">Dashboard & Progress</span>
                  <span className="sm:hidden">Progress</span>
                </button>
                <button
                  onClick={() => setActiveTab('logs')}
                  className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-all ${
                    activeTab === 'logs'
                      ? 'bg-[#4F6C47] text-white shadow-sm'
                      : 'text-slate-600 hover:text-slate-900 hover:bg-white/60'
                  }`}
                >
                  <Icons.ClipboardList />
                  <span>Daily Records</span>
                </button>
                <button
                  onClick={() => setActiveTab('customers')}
                  className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-all ${
                    activeTab === 'customers'
                      ? 'bg-[#4F6C47] text-white shadow-sm'
                      : 'text-slate-600 hover:text-slate-900 hover:bg-white/60'
                  }`}
                >
                  <Icons.Users />
                  <span className="hidden sm:inline">Customers Directory</span>
                  <span className="sm:hidden">Buyers</span>
                </button>
              </nav>
            </div>
          </header>

          {/* Main Workspace Body */}
          <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            
            {/* Quick Action Entry Bar */}
            <div className="mb-6 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-2">
                <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Fast Entry Action:</span>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => setActiveModal('SEED_ADD')}
                  className="inline-flex items-center space-x-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 transition"
                >
                  <Icons.Plus /> <span>+ Seed Stock Arrival</span>
                </button>
                <button
                  onClick={() => setActiveModal('CRUSHING')}
                  className="inline-flex items-center space-x-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100 transition"
                >
                  <Icons.Plus /> <span>+ Daily Crushing Log</span>
                </button>
                <button
                  onClick={() => handleOpenOrderModal()}
                  className="inline-flex items-center space-x-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-blue-50 text-blue-800 border border-blue-200 hover:bg-blue-100 transition"
                >
                  <Icons.Plus /> <span>+ New Order Sale</span>
                </button>
                <button
                  onClick={() => handleOpenPaymentModal()}
                  className="inline-flex items-center space-x-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-purple-50 text-purple-800 border border-purple-200 hover:bg-purple-100 transition"
                >
                  <Icons.Plus /> <span>+ Payment Collection</span>
                </button>
              </div>
            </div>

            {}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                
                {/* Metric Cards Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition">
                    <div className="flex items-center justify-between text-slate-500 mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider">Estimated Seed Stock</span>
                      <div className="p-2 bg-amber-50 text-amber-700 rounded-lg"><Icons.Package /></div>
                    </div>
                    <div className="text-2xl font-extrabold text-slate-900">{totals.currentSeedStockTons.toFixed(2)} MT</div>
                    <div className="text-xs text-slate-500 mt-1">Total Seed Added: {(totals.seedAdded / 1000).toFixed(1)} MT</div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition">
                    <div className="flex items-center justify-between text-slate-500 mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider">Total Seed Crushed</span>
                      <div className="p-2 bg-emerald-50 text-[#4F6C47] rounded-lg"><Icons.TrendingUp /></div>
                    </div>
                    <div className="text-2xl font-extrabold text-slate-900">{(totals.seedCrushed / 1000).toFixed(2)} MT</div>
                    <div className="text-xs text-emerald-700 font-medium mt-1">Total Crushing Yield Logged</div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition">
                    <div className="flex items-center justify-between text-slate-500 mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider">Oil Extracted</span>
                      <div className="p-2 bg-blue-50 text-blue-700 rounded-lg"><Icons.Droplets /></div>
                    </div>
                    <div className="text-2xl font-extrabold text-slate-900">{totals.oilProduced.toLocaleString()} Ltr</div>
                    <div className="text-xs text-slate-500 mt-1">Oil Cake Output: {(totals.cakeProduced / 1000).toFixed(2)} MT</div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition">
                    <div className="flex items-center justify-between text-slate-500 mb-2">
                      <span className="text-xs font-bold uppercase tracking-wider">Outstanding Receivables</span>
                      <div className="p-2 bg-purple-50 text-purple-700 rounded-lg"><Icons.DollarSign /></div>
                    </div>
                    <div className="text-2xl font-extrabold text-slate-900">₹{totals.totalReceivables.toLocaleString()}</div>
                    <div className="text-xs text-slate-500 mt-1">Collected: ₹{totals.paymentsCollected.toLocaleString()}</div>
                  </div>
                </div>

                {/* GRAPH SECTION HEADER & CONTROLS */}
                <div className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-xs space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 flex items-center space-x-2">
                        <Icons.BarChart2 />
                        <span>Business Analytics & Progress Graphs</span>
                      </h2>
                      <p className="text-xs text-slate-500 mt-0.5">Visualize daily production crushing output and sales volume</p>
                    </div>

                    <div className="flex flex-wrap items-center gap-3">
                      <input
                        type="month"
                        value={selectedMonth}
                        onChange={(e) => setSelectedMonth(e.target.value)}
                        className="px-3 py-1.5 border border-slate-300 rounded-xl text-xs font-medium bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#4F6C47]"
                      />

                            <span>Oil Extracted (Ltr)</span>
                          </span>
                        </div>
                        <span className="text-slate-400">Month: {selectedMonth}</span>
                      </div>

                      {/* Interactive Bar Visualization Container */}
                      <div className="h-64 flex items-end justify-between space-x-1 sm:space-x-2 pt-8 pb-2 border-b border-slate-200 overflow-x-auto">

                          const maxCrush = Math.max(...dailyGraphData.map(item => item.crushed), 1000);
                          const crushHeightPct = Math.min(100, Math.max(6, (d.crushed / maxCrush) * 100));
                          const oilHeightPct = Math.min(100, Math.max(6, (d.oil / maxCrush) * 100));

                          return (
                            <div key={idx} className="flex-1 min-w-[18px] flex flex-col items-center group relative h-full justify-end">

                                <span className="font-bold text-amber-300">Day {d.day} ({selectedMonth})</span>
                                <span>Seed Crushed: {d.crushed.toLocaleString()} Kg</span>
                                <span>Oil Produced: {d.oil.toLocaleString()} Ltr</span>
                                <span>Sales: ₹{d.sales.toLocaleString()}</span>
                              </div>

                              {/* Bars Stack */}
                              <div className="w-full flex justify-center items-end space-x-0.5 h-full">
                                <div
                                  style={{ height: `${crushHeightPct}%` }}
                                  className={`w-2 sm:w-3 rounded-t-sm transition-all duration-300 ${
                                    d.crushed > 0 ? 'bg-[#4F6C47] group-hover:bg-emerald-600' : 'bg-slate-100'

                                ></div>
                                <div
                                  style={{ height: `${oilHeightPct}%` }}

                                ></div>
                              </div>
                              <span className="text-[10px] font-medium text-slate-400 mt-1">{d.day}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* GRAPH VIEW 2: OILSEED VARIETY DISTRIBUTION */}
                  {graphViewMode === 'seeds' && (
                    <div className="space-y-4">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500">Crushing Tonnage Share by Seed Variety</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {seedVarietyData.map((item, idx) => {
                          const totalCrushedAll = seedVarietyData.reduce((acc, curr) => acc + curr.crushed, 0) || 1;
                          const pct = Math.round((item.crushed / totalCrushedAll) * 100);

                          return (
                            <div key={idx} className="p-3 bg-slate-50 rounded-xl border border-slate-100 flex flex-col justify-between">
                              <div className="flex justify-between items-center text-sm font-bold text-slate-800">
                                <span>{item.name} Seed</span>
                                <span className="text-xs font-medium text-slate-500">{(item.crushed / 1000).toFixed(2)} MT ({pct}%)</span>
                              </div>
                              <div className="w-full bg-slate-200 h-2.5 rounded-full mt-2 overflow-hidden">
                                <div
                                  className="bg-[#4F6C47] h-full rounded-full transition-all duration-500"
                                  style={{ width: `${pct}%` }}
                                ></div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

            {}
            {activeTab === 'logs' && (
              <div className="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-6 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900">Daily Operational Logs</h2>
                    <p className="text-xs text-slate-500">Search and audit all daily mill logs, sales orders, and receipts</p>

                    {/* Search Input */}
                    <div className="relative flex-1 sm:w-64">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <Icons.Search />
                      </div>
                      <input
                        type="text"
                        placeholder="Search logs or buyers..."

                        onChange={(e) => setSearchQuery(e.target.value)}

                      />
                    </div>

                    {/* Filter Category */}
                    <select
                      value={logCategoryFilter}
                      onChange={(e) => setLogCategoryFilter(e.target.value)}

                    >
                      <option value="ALL">All Log Categories</option>
                      <option value="SEED_ADD">Seed Additions</option>

                      <option value="PAYMENT">Payments Received</option>

                  </div>
                </div>

                {/* LOGS TABLE */}
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                        <th className="p-3">Date</th>
                        <th className="p-3">Type</th>
                        <th className="p-3">Details / Product</th>
                        <th className="p-3">Quantity</th>
                        <th className="p-3">Party / Notes</th>
                        <th className="p-3 text-right">Amount (₹)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {logs.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="p-8 text-center text-slate-400">
                            No logs recorded yet. Use the top buttons to log seed arrivals, crushing yield, orders, or payments!
                          </td>
                        </tr>
                      ) : (
                        logs
                          .filter(log => {
                            if (logCategoryFilter !== 'ALL' && log.type !== logCategoryFilter) return false;
                            if (searchQuery.trim() !== '') {
                              const q = searchQuery.toLowerCase();
                              return (
                                (log.customerName && log.customerName.toLowerCase().includes(q)) ||
                                (log.seedType && log.seedType.toLowerCase().includes(q)) ||
                                (log.product && log.product.toLowerCase().includes(q)) ||
                                (log.notes && log.notes.toLowerCase().includes(q))
                              );
                            }
                            return true;
                          })
                          .map((log) => (
                            <tr key={log.id} className="hover:bg-slate-50/80 transition">
                              <td className="p-3 font-semibold text-slate-800">{log.date}</td>
                              <td className="p-3">
                                {log.type === 'SEED_ADD' && <span className="px-2 py-1 rounded-md text-[10px] font-bold bg-amber-100 text-amber-800">Seed Addition</span>}
                                {log.type === 'CRUSHING' && <span className="px-2 py-1 rounded-md text-[10px] font-bold bg-emerald-100 text-emerald-800">Daily Crushing</span>}
                                {log.type === 'ORDER' && <span className="px-2 py-1 rounded-md text-[10px] font-bold bg-blue-100 text-blue-800">Order Sale</span>}
                                {log.type === 'PAYMENT' && <span className="px-2 py-1 rounded-md text-[10px] font-bold bg-purple-100 text-purple-800">Payment In</span>}
                              </td>

                                {log.seedType ? `${log.seedType} Seed` : log.product || '-'}
                              </td>
                              <td className="p-3 text-slate-600">
                                {log.quantityKg && `${log.quantityKg} Kg`}
                                {log.seedCrushedKg && `${log.seedCrushedKg} Kg Crushed (${log.oilProducedLtr}L Oil)`}
                                {log.quantity && `${log.quantity} ${log.unit || 'L'}`}
                                {!log.quantityKg && !log.seedCrushedKg && !log.quantity && '-'}
                              </td>
                              <td className="p-3 text-slate-600">
                                {log.customerName || log.supplier || log.notes || '-'}
                              </td>
                              <td className="p-3 text-right font-extrabold text-slate-900">
                                {log.totalAmount ? `₹${log.totalAmount.toLocaleString()}` : log.amountPaid ? `₹${log.amountPaid.toLocaleString()}` : '-'}
                              </td>
                            </tr>
                          ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {}
            {activeTab === 'customers' && (
              <div className="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-6 space-y-6">
                <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100">

                  </div>

                    <Icons.Plus /> <span>+ Add New Customer</span>
                  </button>
                </div>

                    customers.map((c) => (

                            <h3 className="font-extrabold text-slate-900 text-base">{c.name}</h3>
                            <div className="flex items-center space-x-1 text-xs text-slate-500 mt-0.5">
                              <Icons.Phone /> <span>{c.phone || 'No phone'}</span>
                            </div>
                          </div>
                          <span className={`px-2 py-1 rounded-md text-[10px] font-bold ${
                            c.outstandingBalance > 0 ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'

                          </span>

                            <span className="font-black text-rose-600 text-sm">₹{(c.outstandingBalance || 0).toLocaleString()}</span>
                          </div>
                          <div className="text-right">
                            <span className="text-slate-400 block text-[10px] uppercase font-bold">Credit Limit</span>
                            <span className="font-bold text-slate-700">₹{(c.creditLimit || 0).toLocaleString()}</span>
                          </div>
                        </div>

                        {/* Inline Actions */}
                        <div className="pt-2 flex gap-2">
                          <button
                            onClick={() => handleOpenOrderModal(c.name)}
                            className="flex-1 py-1.5 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold hover:bg-blue-100 transition"

                          <button
                            onClick={() => handleOpenPaymentModal(c.name)}

                          >
                            + Log Payment

                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

          </main>

          {}

          {/* 1. SEED ADDITION MODAL */}
          {activeModal === 'SEED_ADD' && (
            <ModalWrapper title="Log Raw Seed Addition (Arrival)" onClose={() => setActiveModal(null)}>
              <form onSubmit={(e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                handleAddLog({
                  id: Date.now(),
                  type: 'SEED_ADD',
                  date: fd.get('date'),
                  seedType: fd.get('seedType'),
                  quantityKg: Number(fd.get('quantityKg')),
                  supplier: fd.get('supplier'),
                  notes: fd.get('notes')
                });
              }} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Arrival Date</label>
                  <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Seed Variety</label>
                  <select name="seedType" required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
                    {OIL_SEEDS_LIST.map(s => <option key={s} value={s}>{s} Seed</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Quantity Added (Kg)</label>
                  <input type="number" name="quantityKg" placeholder="e.g. 5000" required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Supplier / Yard Source</label>
                  <input type="text" name="supplier" placeholder="Supplier name or bill no" className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                </div>
                <div className="flex justify-end space-x-3 pt-3 border-t">
                  <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition">Cancel</button>
                  <button type="submit" className="px-4 py-2 text-xs font-bold text-white bg-[#4F6C47] rounded-xl hover:bg-emerald-800 transition">Save Seed Log</button>
                </div>
              </form>
            </ModalWrapper>
          )}

          {/* 2. DAILY CRUSHING MODAL */}
          {activeModal === 'CRUSHING' && (
            <ModalWrapper title="Log Daily Crushing Output" onClose={() => setActiveModal(null)}>
              <form onSubmit={(e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                handleAddLog({
                  id: Date.now(),
                  type: 'CRUSHING',
                  date: fd.get('date'),
                  seedType: fd.get('seedType'),
                  seedCrushedKg: Number(fd.get('seedCrushedKg')),
                  oilProducedLtr: Number(fd.get('oilProducedLtr')),
                  cakeProducedKg: Number(fd.get('cakeProducedKg')),
                  notes: fd.get('notes')
                });
              }} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Crushing Date</label>
                  <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Seed Variety Crushed</label>
                  <select name="seedType" required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
                    {OIL_SEEDS_LIST.map(s => <option key={s} value={s}>{s} Seed</option>)}
                  </select>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Seed Crushed (Kg)</label>
                    <input type="number" name="seedCrushedKg" placeholder="1000" required className="w-full p-2 border border-slate-300 rounded-xl text-xs" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Oil Output (Ltr)</label>
                    <input type="number" name="oilProducedLtr" placeholder="400" required className="w-full p-2 border border-slate-300 rounded-xl text-xs" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Cake Output (Kg)</label>
                    <input type="number" name="cakeProducedKg" placeholder="580" required className="w-full p-2 border border-slate-300 rounded-xl text-xs" />
                  </div>
                </div>
                <div className="flex justify-end space-x-3 pt-3 border-t">
                  <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition">Cancel</button>
                  <button type="submit" className="px-4 py-2 text-xs font-bold text-white bg-[#4F6C47] rounded-xl hover:bg-emerald-800 transition">Save Output Log</button>
                </div>
              </form>
            </ModalWrapper>
          )}

          {/* 3. ORDER ENTRY MODAL */}
          {activeModal === 'ORDER' && (
            <ModalWrapper title="Log Sales Order Entry" onClose={() => setActiveModal(null)}>
              <OrderForm
                customers={customers}
                prefilledCustomer={prefilledCustomer}
                onSubmit={(orderData) => {
                  if (orderData.isNewCustomer && orderData.customerName) {
                    handleAddCustomer({
                      id: Date.now() + 1,
                      name: orderData.customerName,
                      phone: orderData.phone || '',
                      address: '',
                      outstandingBalance: orderData.totalAmount,
                      creditLimit: 50000
                    });
                  } else {
                    setCustomers(prev => prev.map(c => c.name === orderData.customerName ? {
                      ...c,
                      outstandingBalance: (c.outstandingBalance || 0) + orderData.totalAmount
                    } : c));
                  }

                  handleAddLog({
                    id: Date.now(),
                    type: 'ORDER',
                    ...orderData
                  });
                }}
                onCancel={() => setActiveModal(null)}
              />
            </ModalWrapper>
          )}

          {/* 4. PAYMENT COLLECTION MODAL */}
          {activeModal === 'PAYMENT' && (
            <ModalWrapper title="Log Payment Collection" onClose={() => setActiveModal(null)}>
              <PaymentForm
                customers={customers}
                prefilledCustomer={prefilledCustomer}
                onSubmit={(payData) => {
                  setCustomers(prev => prev.map(c => c.name === payData.customerName ? {
                    ...c,
                    outstandingBalance: Math.max(0, (c.outstandingBalance || 0) - payData.amountPaid)
                  } : c));

                  handleAddLog({
                    id: Date.now(),
                    type: 'PAYMENT',
                    ...payData
                  });
                }}
                onCancel={() => setActiveModal(null)}
              />
            </ModalWrapper>
          )}

          {/* 5. ADD CUSTOMER MODAL */}
          {activeModal === 'ADD_CUSTOMER' && (
            <ModalWrapper title="Add New Customer Profile" onClose={() => setActiveModal(null)}>
              <form onSubmit={(e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                handleAddCustomer({
                  id: Date.now(),
                  name: fd.get('name'),
                  phone: fd.get('phone'),
                  address: fd.get('address'),
                  outstandingBalance: Number(fd.get('outstandingBalance') || 0),
                  creditLimit: Number(fd.get('creditLimit') || 50000)
                });
              }} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer / Firm Name</label>
                  <input type="text" name="name" placeholder="e.g. Laxmi Traders" required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Phone Number</label>
                  <input type="tel" name="phone" placeholder="10-digit mobile no." className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">City / Address</label>
                  <input type="text" name="address" placeholder="e.g. Market Yard, Latur" className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Opening Balance (₹)</label>
                    <input type="number" name="outstandingBalance" defaultValue="0" className="w-full p-2 border border-slate-300 rounded-xl text-xs" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Credit Limit (₹)</label>
                    <input type="number" name="creditLimit" defaultValue="50000" className="w-full p-2 border border-slate-300 rounded-xl text-xs" />
                  </div>
                </div>
                <div className="flex justify-end space-x-3 pt-3 border-t">
                  <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition">Cancel</button>
                  <button type="submit" className="px-4 py-2 text-xs font-bold text-white bg-[#4F6C47] rounded-xl hover:bg-emerald-800 transition">Save Profile</button>
                </div>
              </form>
            </ModalWrapper>
          )}

        </div>
      );
    }

    function ModalWrapper({ title, children, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs" onClick={onClose}>
          <div className="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 overflow-hidden animate-fade-in" onClick={e => e.stopPropagation()}>
            <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
              <h3 className="font-extrabold text-slate-900 text-sm">{title}</h3>
              <button onClick={onClose} className="p-1 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-200 transition">
                <Icons.X />
              </button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function OrderForm({ customers, prefilledCustomer, onSubmit, onCancel }) {
      const [isNew, setIsNew] = useState(false);
      const [selectedCustomer, setSelectedCustomer] = useState(prefilledCustomer || (customers[0]?.name || ''));

      return (
        <form onSubmit={(e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const qty = Number(fd.get('quantity'));
          const rate = Number(fd.get('rate'));

          onSubmit({
            date: fd.get('date'),
            customerName: isNew ? fd.get('newCustomerName') : selectedCustomer,
            isNewCustomer: isNew,
            phone: isNew ? fd.get('newCustomerPhone') : '',
            product: fd.get('product'),
            quantity: qty,
            unit: fd.get('unit') || 'L',
            totalAmount: qty * rate,
            notes: fd.get('notes')
          });
        }} className="space-y-4">
          <div>
            <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Order Date</label>
            <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
          </div>

          <div>
            <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer / Buyer</label>
            {!isNew ? (
              <div className="space-y-2">
                <select
                  value={selectedCustomer}
                  onChange={(e) => {
                    if (e.target.value === '__NEW__') setIsNew(true);
                    else setSelectedCustomer(e.target.value);
                  }}
                  className="w-full p-2.5 border border-slate-300 rounded-xl text-sm"
                >
                  {customers.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                  <option value="__NEW__">➕ Enter New Customer Name...</option>
                </select>
                <button type="button" onClick={() => setIsNew(true)} className="text-xs text-[#4F6C47] font-bold hover:underline">
                  + Add New Customer Name
                </button>
              </div>
            ) : (
              <div className="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                <input type="text" name="newCustomerName" placeholder="Enter Full Customer Name" required className="w-full p-2 border border-slate-300 rounded-xl text-sm" />
                <input type="tel" name="newCustomerPhone" placeholder="Mobile phone no." className="w-full p-2 border border-slate-300 rounded-xl text-sm" />
                <button type="button" onClick={() => setIsNew(false)} className="text-xs text-slate-500 font-medium hover:underline">
                  ← Select from existing directory
                </button>
              </div>
            )}
          </div>

          <div>
            <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Product Description</label>
            <select name="product" required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
              {Object.entries(PRODUCT_CATALOGUE).map(([seed, items]) => (
                <optgroup key={seed} label={`${seed} Oil & By-products`}>
                  {items.map(item => <option key={item} value={item}>{item}</option>)}
                </optgroup>
              ))}
            </select>
          </div>

          <div className="grid grid-cols-3 gap-2">
            <div>
              <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Quantity</label>
              <input type="number" name="quantity" placeholder="100" required className="w-full p-2 border border-slate-300 rounded-xl text-xs" />
            </div>
            <div>
              <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Unit</label>
              <select name="unit" className="w-full p-2 border border-slate-300 rounded-xl text-xs">
                <option value="L">Litres (L)</option>
                <option value="Bottles">Bottles</option>
                <option value="Bags (50Kg)">Bags (50Kg)</option>
                <option value="MT">Metric Tons</option>
              </select>
            </div>
            <div>
              <label className="block text-[10px] font-bold uppercase text-slate-500 mb-1">Rate (₹ / Unit)</label>
              <input type="number" name="rate" placeholder="140" required className="w-full p-2 border border-slate-300 rounded-xl text-xs" />
            </div>
          </div>

          <div className="flex justify-end space-x-3 pt-3 border-t">
            <button type="button" onClick={onCancel} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition">Cancel</button>
            <button type="submit" className="px-4 py-2 text-xs font-bold text-white bg-[#4F6C47] rounded-xl hover:bg-emerald-800 transition">Save Order</button>
          </div>
        </form>
      );
    }

    function PaymentForm({ customers, prefilledCustomer, onSubmit, onCancel }) {
      const [selectedCustomer, setSelectedCustomer] = useState(prefilledCustomer || (customers[0]?.name || ''));

      return (
        <form onSubmit={(e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          onSubmit({
            date: fd.get('date'),
            customerName: selectedCustomer,
            amountPaid: Number(fd.get('amountPaid')),
            paymentMode: fd.get('paymentMode'),
            notes: fd.get('notes')
          });
        }} className="space-y-4">
          <div>
            <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Receipt Date</label>
            <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
          </div>

          <div>
            <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Customer / Buyer</label>
            <select
              value={selectedCustomer}
              onChange={(e) => setSelectedCustomer(e.target.value)}
              className="w-full p-2.5 border border-slate-300 rounded-xl text-sm"
            >
              {customers.map(c => <option key={c.id} value={c.name}>{c.name} (Bal: ₹{c.outstandingBalance})</option>)}
            </select>
          </div>

          <div>
            <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Amount Collected (₹)</label>
            <input type="number" name="amountPaid" placeholder="e.g. 25000" required className="w-full p-2.5 border border-slate-300 rounded-xl text-sm" />
          </div>

          <div>
            <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Payment Mode</label>
            <select name="paymentMode" className="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
              <option value="UPI / Online Transfer">UPI / Online Transfer</option>
              <option value="NEFT / RTGS">NEFT / RTGS</option>
              <option value="Cash">Cash</option>
              <option value="Cheque">Cheque</option>
            </select>
          </div>

          <div className="flex justify-end space-x-3 pt-3 border-t">
            <button type="button" onClick={onCancel} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition">Cancel</button>
            <button type="submit" className="px-4 py-2 text-xs font-bold text-white bg-[#4F6C47] rounded-xl hover:bg-emerald-800 transition">Save Payment</button>
          </div>
        </form>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
