<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Shri Jagdamba Industry - Daily Monitor</title>
  <meta name="description" content="Daily Operational & Sales Monitoring System for Shri Jagdamba Industry" />
  <meta name="theme-color" content="#2D6A4F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Shri Jagdamba" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%232D6A4F'/%3E%3Ctext x='256' y='320' font-family='sans-serif' font-size='200' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'%3ESJI%3C/text%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('SW Registered:', reg.scope))
          .catch((err) => console.log('SW Registration failed:', err));
      });
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8FAF8;
      color: #1B2A22;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #EAEFEA; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #A3B899; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#F8FAF8] text-[#1B2A22] antialiased selection:bg-[#2D6A4F] selection:text-white pb-24 md:pb-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SEED_TYPES = [
      { id: 'groundnut', name: 'Groundnut', unit: 'MT', yieldOil: 42, yieldCake: 56 },
      { id: 'sunflower', name: 'Sunflower', unit: 'MT', yieldOil: 38, yieldCake: 60 },
      { id: 'safflower', name: 'Safflower', unit: 'MT', yieldOil: 32, yieldCake: 66 },
      { id: 'sesame', name: 'Sesame', unit: 'MT', yieldOil: 45, yieldCake: 53 },
      { id: 'mustard', name: 'Mustard', unit: 'MT', yieldOil: 35, yieldCake: 63 },
      { id: 'coconut', name: 'Coconut (Copra)', unit: 'MT', yieldOil: 62, yieldCake: 36 },
      { id: 'flaxseed', name: 'Flaxseed', unit: 'MT', yieldOil: 34, yieldCake: 64 }
    ];

    const PRODUCT_OPTIONS = [
      { group: 'Groundnut Products', items: ['Groundnut Oil (Loose Oil)', 'Groundnut Oil (5 ltr)', 'Groundnut Oil (1 ltr)', 'Groundnut Oil (500 ml)', 'Groundnut Oil (200 ml)', 'Groundnut Oil (100 ml)', 'Groundnut Cake (Loose)', 'Groundnut Cake (50 Kg Bag)', 'Groundnut Cake (25 Kg Bag)'] },
      { group: 'Sunflower Products', items: ['Sunflower Oil (Loose Oil)', 'Sunflower Oil (5 ltr)', 'Sunflower Oil (1 ltr)', 'Sunflower Oil (500 ml)', 'Sunflower Oil (200 ml)', 'Sunflower Oil (100 ml)', 'Sunflower Cake (Loose)', 'Sunflower Cake (50 Kg Bag)', 'Sunflower Cake (25 Kg Bag)'] },
      { group: 'Safflower Products', items: ['Safflower Oil (Loose Oil)', 'Safflower Oil (5 ltr)', 'Safflower Oil (1 ltr)', 'Safflower Oil (500 ml)', 'Safflower Oil (200 ml)', 'Safflower Oil (100 ml)', 'Safflower Cake (Loose)', 'Safflower Cake (50 Kg Bag)', 'Safflower Cake (25 Kg Bag)'] },
      { group: 'Sesame Products', items: ['Sesame Oil (Loose Oil)', 'Sesame Oil (5 ltr)', 'Sesame Oil (1 ltr)', 'Sesame Oil (500 ml)', 'Sesame Oil (200 ml)', 'Sesame Oil (100 ml)', 'Sesame Cake (Loose)', 'Sesame Cake (50 Kg Bag)', 'Sesame Cake (25 Kg Bag)'] },
      { group: 'Mustard Products', items: ['Mustard Oil (Loose Oil)', 'Mustard Oil (5 ltr)', 'Mustard Oil (1 ltr)', 'Mustard Oil (500 ml)', 'Mustard Oil (200 ml)', 'Mustard Oil (100 ml)', 'Mustard Cake (Loose)', 'Mustard Cake (50 Kg Bag)', 'Mustard Cake (25 Kg Bag)'] },
      { group: 'Coconut Products', items: ['Coconut Oil (Loose Oil)', 'Coconut Oil (5 ltr)', 'Coconut Oil (1 ltr)', 'Coconut Oil (500 ml)', 'Coconut Oil (200 ml)', 'Coconut Oil (100 ml)', 'Coconut Cake (Loose)', 'Coconut Cake (50 Kg Bag)', 'Coconut Cake (25 Kg Bag)'] },
      { group: 'Flaxseed Products', items: ['Flaxseed Oil (Loose Oil)', 'Flaxseed Oil (5 ltr)', 'Flaxseed Oil (1 ltr)', 'Flaxseed Oil (500 ml)', 'Flaxseed Oil (200 ml)', 'Flaxseed Oil (100 ml)', 'Flaxseed Cake (Loose)', 'Flaxseed Cake (50 Kg Bag)', 'Flaxseed Cake (25 Kg Bag)'] }
    ];

    function BrandLogo({ className = "w-10 h-10" }) {
      return (
        <div className={`flex items-center justify-center rounded-xl bg-[#2D6A4F] text-white font-black shadow-md ${className}`}>
          <i className="fa-solid fa-seedling text-lg"></i>
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState('dashboard');
      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('sji_logs_v3');
        return saved ? JSON.parse(saved) : [];
      });
      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('sji_customers_v3');
        return saved ? JSON.parse(saved) : [];
      });

      const [activeModal, setActiveModal] = useState(null);
      const [modalCustomer, setModalCustomer] = useState('');

      useEffect(() => {
        localStorage.setItem('sji_logs_v3', JSON.stringify(logs));
      }, [logs]);

      useEffect(() => {
        localStorage.setItem('sji_customers_v3', JSON.stringify(customers));
      }, [customers]);

      const openModal = (type, custName = '') => {
        setModalCustomer(custName);
        setActiveModal(type);
      };

      const handleAddLog = (newLog) => {
        setLogs(prev => [newLog, ...prev]);
        setActiveModal(null);
      };

      const handleAddCustomer = (newCust) => {
        setCustomers(prev => [...prev, newCust]);
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-30 bg-[#F8FAF8]/95 backdrop-blur-md border-b border-[#E0E7E1] px-4 py-3 sm:px-6">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <BrandLogo />
                <div>
                  <h1 className="text-lg sm:text-xl font-bold tracking-tight text-[#1B2A22]">Shri Jagdamba Ind.</h1>
                  <p className="text-xs text-[#52796F] font-medium">Daily Monitoring System</p>
                </div>
              </div>
              <div className="hidden sm:flex items-center gap-2">
                <button onClick={() => openModal('seed')} className="bg-[#2D6A4F] hover:bg-[#204E3A] text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition">
                  <i className="fa-solid fa-plus mr-1"></i> Add Raw Seed
                </button>
                <button onClick={() => openModal('order')} className="bg-[#40916C] hover:bg-[#2D6A4F] text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition">
                  <i className="fa-solid fa-cart-plus mr-1"></i> New Order
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
            {tab === 'dashboard' && (
              <DashboardSection logs={logs} customers={customers} openModal={openModal} />
            )}
            {tab === 'records' && (
              <RecordsSection logs={logs} openModal={openModal} />
            )}
            {tab === 'customers' && (
              <CustomersSection customers={customers} logs={logs} onAddCustomer={handleAddCustomer} openModal={openModal} />
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-[#E0E7E1] px-6 py-2 flex justify-around items-center md:hidden">
            <button onClick={() => setTab('dashboard')} className={`flex flex-col items-center gap-1 ${tab === 'dashboard' ? 'text-[#2D6A4F] font-bold' : 'text-gray-400'}`}>
              <i className="fa-solid fa-chart-pie text-lg"></i>
              <span className="text-[10px]">Dashboard</span>
            </button>
            <button onClick={() => setTab('records')} className={`flex flex-col items-center gap-1 ${tab === 'records' ? 'text-[#2D6A4F] font-bold' : 'text-gray-400'}`}>
              <i className="fa-solid fa-list-check text-lg"></i>
              <span className="text-[10px]">Records</span>
            </button>
            <button onClick={() => setTab('customers')} className={`flex flex-col items-center gap-1 ${tab === 'customers' ? 'text-[#2D6A4F] font-bold' : 'text-gray-400'}`}>
              <i className="fa-solid fa-users text-lg"></i>
              <span className="text-[10px]">Buyers</span>
            </button>
          </nav>

          <div className="hidden md:flex justify-center gap-4 fixed bottom-6 left-1/2 -translate-x-1/2 bg-white px-4 py-2 rounded-full shadow-lg border border-[#E0E7E1] z-40">
            <button onClick={() => setTab('dashboard')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition ${tab === 'dashboard' ? 'bg-[#2D6A4F] text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Dashboard</button>
            <button onClick={() => setTab('records')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition ${tab === 'records' ? 'bg-[#2D6A4F] text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Daily Records</button>
            <button onClick={() => setTab('customers')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition ${tab === 'customers' ? 'bg-[#2D6A4F] text-white' : 'text-gray-600 hover:bg-gray-100'}`}>Customer Directory</button>
          </div>

          {activeModal && (
            <ModalWrapper onClose={() => setActiveModal(null)}>
              {activeModal === 'seed' && <SeedModal onAdd={handleAddLog} onClose={() => setActiveModal(null)} />}
              {activeModal === 'crush' && <CrushModal onAdd={handleAddLog} onClose={() => setActiveModal(null)} />}
              {activeModal === 'order' && <OrderModal customers={customers} defaultCust={modalCustomer} onAdd={handleAddLog} onAddCust={handleAddCustomer} onClose={() => setActiveModal(null)} />}
              {activeModal === 'payment' && <PaymentModal customers={customers} defaultCust={modalCustomer} onAdd={handleAddLog} onClose={() => setActiveModal(null)} />}
              {activeModal === 'delivery' && <DeliveryModal logs={logs} onAdd={handleAddLog} onClose={() => setActiveModal(null)} />}
            </ModalWrapper>
          )}
        </div>
      );
    }

    function DashboardSection({ logs, customers, openModal }) {
      const seedStock = SEED_TYPES.reduce((acc, s) => {
        const added = logs.filter(l => l.type === 'seed' && l.seedId === s.id).reduce((sum, l) => sum + Number(l.quantity || 0), 0);
        const crushed = logs.filter(l => l.type === 'crush' && l.seedId === s.id).reduce((sum, l) => sum + Number(l.quantity || 0), 0);
        acc[s.id] = Math.max(0, added - crushed);
        return acc;
      }, {});

      const totalRevenue = logs.filter(l => l.type === 'order').reduce((sum, l) => sum + Number(l.totalAmount || 0), 0);
      const totalCollected = logs.filter(l => l.type === 'payment').reduce((sum, l) => sum + Number(l.amount || 0), 0);
      const totalPending = totalRevenue - totalCollected;

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            <div className="bg-white p-4 rounded-2xl border border-[#E0E7E1] shadow-sm">
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Total Sales</p>
              <h3 className="text-lg sm:text-2xl font-black text-[#1B2A22] mt-1">₹{totalRevenue.toLocaleString()}</h3>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-[#E0E7E1] shadow-sm">
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Collected</p>
              <h3 className="text-lg sm:text-2xl font-black text-[#2D6A4F] mt-1">₹{totalCollected.toLocaleString()}</h3>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-[#E0E7E1] shadow-sm">
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Receivables</p>
              <h3 className="text-lg sm:text-2xl font-black text-[#E63946] mt-1">₹{totalPending.toLocaleString()}</h3>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-[#E0E7E1] shadow-sm flex flex-col justify-between">
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Quick Actions</p>
              <div className="flex gap-2 mt-2">
                <button onClick={() => openModal('crush')} className="flex-1 bg-[#52796F] hover:bg-[#354F52] text-white py-1.5 px-2 rounded-lg text-xs font-bold transition">
                  <i className="fa-solid fa-gears mr-1"></i> Crush
                </button>
                <button onClick={() => openModal('payment')} className="flex-1 bg-[#2D6A4F] hover:bg-[#204E3A] text-white py-1.5 px-2 rounded-lg text-xs font-bold transition">
                  <i className="fa-solid fa-indian-rupee-sign mr-1"></i> Payment
                </button>
              </div>
            </div>
          </div>

          <div className="bg-white p-5 rounded-2xl border border-[#E0E7E1] shadow-sm">
            <h3 className="text-sm font-bold text-[#1B2A22] mb-3 flex items-center gap-2">
              <i className="fa-solid fa-warehouse text-[#2D6A4F]"></i> Current Raw Seed Inventory
            </h3>
            <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
              {SEED_TYPES.map(seed => (
                <div key={seed.id} className="p-3 rounded-xl bg-[#F8FAF8] border border-[#EAEFEA] text-center">
                  <p className="text-xs font-medium text-gray-600 truncate">{seed.name}</p>
                  <p className="text-base font-extrabold text-[#1B2A22] mt-1">
                    {seedStock[seed.id] || 0} <span className="text-xs font-normal text-gray-500">MT</span>
                  </p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function RecordsSection({ logs, openModal }) {
      return (
        <div className="bg-white rounded-2xl border border-[#E0E7E1] shadow-sm overflow-hidden">
          <div className="p-4 border-b border-[#E0E7E1] flex justify-between items-center">
            <h3 className="font-bold text-[#1B2A22]">Transaction & Daily Log</h3>
            <div className="flex gap-2">
              <button onClick={() => openModal('order')} className="text-xs bg-[#2D6A4F] text-white font-semibold px-3 py-1.5 rounded-lg">
                + New Order
              </button>
            </div>
          </div>
          <div className="overflow-x-auto custom-scrollbar">
            {logs.length === 0 ? (
              <div className="py-12 text-center text-gray-400">
                <i className="fa-solid fa-clipboard-list text-3xl mb-2"></i>
                <p className="text-sm">No records added yet. Start by logging seed stock or orders!</p>
              </div>
            ) : (
              <table className="w-full text-left text-xs">
                <thead className="bg-[#F8FAF8] text-gray-600 uppercase font-semibold border-b border-[#E0E7E1]">
                  <tr>
                    <th className="p-3">Date</th>
                    <th className="p-3">Type</th>
                    <th className="p-3">Details</th>
                    <th className="p-3">Quantity</th>
                    <th className="p-3 text-right">Amount</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#E0E7E1]">
                  {logs.map((log, idx) => (
                    <tr key={idx} className="hover:bg-gray-50">
                      <td className="p-3 whitespace-nowrap text-gray-500">{log.date}</td>
                      <td className="p-3 whitespace-nowrap">
                        <span className={`px-2 py-0.5 rounded-md font-bold uppercase text-[10px] ${
                          log.type === 'order' ? 'bg-blue-100 text-blue-800' :
                          log.type === 'payment' ? 'bg-green-100 text-green-800' :
                          log.type === 'seed' ? 'bg-amber-100 text-amber-800' : 'bg-purple-100 text-purple-800'
                        }`}>
                          {log.type}
                        </span>
                      </td>
                      <td className="p-3">{log.details || log.product || log.customer || '-'}</td>
                      <td className="p-3 whitespace-nowrap">{log.quantity ? `${log.quantity} ${log.unit || ''}` : '-'}</td>
                      <td className="p-3 text-right font-bold whitespace-nowrap">{log.amount || log.totalAmount ? `₹${Number(log.amount || log.totalAmount).toLocaleString()}` : '-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }

    function CustomersSection({ customers, logs, onAddCustomer, openModal }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [city, setCity] = useState('');

      const handleCreate = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onAddCustomer({ id: Date.now().toString(), name, phone, city });
        setName('');
        setPhone('');
        setCity('');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-2xl border border-[#E0E7E1] shadow-sm">
            <h3 className="text-sm font-bold text-[#1B2A22] mb-3">Add New Customer</h3>
            <form onSubmit={handleCreate} className="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <input type="text" placeholder="Customer Name *" value={name} onChange={e => setName(e.target.value)} required className="p-2.5 text-xs rounded-xl border border-gray-300 focus:outline-[#2D6A4F]" />
              <input type="tel" placeholder="Phone Number" value={phone} onChange={e => setPhone(e.target.value)} className="p-2.5 text-xs rounded-xl border border-gray-300 focus:outline-[#2D6A4F]" />
              <input type="text" placeholder="City / Area" value={city} onChange={e => setCity(e.target.value)} className="p-2.5 text-xs rounded-xl border border-gray-300 focus:outline-[#2D6A4F]" />
              <button type="submit" className="bg-[#2D6A4F] hover:bg-[#204E3A] text-white text-xs font-bold py-2.5 px-4 rounded-xl transition">
                + Register Customer
              </button>
            </form>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {customers.map(c => {
              const orders = logs.filter(l => l.type === 'order' && l.customer === c.name);
              const totalBilled = orders.reduce((s, o) => s + Number(o.totalAmount || 0), 0);
              const totalPaid = logs.filter(l => l.type === 'payment' && l.customer === c.name).reduce((s, p) => s + Number(p.amount || 0), 0);
              const due = totalBilled - totalPaid;

              return (
                <div key={c.id} className="bg-white p-4 rounded-2xl border border-[#E0E7E1] shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-start">
                      <div>
                        <h4 className="font-bold text-[#1B2A22] text-sm">{c.name}</h4>
                        <p className="text-xs text-gray-500">{c.city || 'Local Buyer'} • {c.phone || 'No Phone'}</p>
                      </div>
                      <span className={`text-xs px-2 py-0.5 rounded-md font-bold ${due > 0 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                        {due > 0 ? `Due: ₹${due.toLocaleString()}` : 'Cleared'}
                      </span>
                    </div>
                  </div>
                  <div className="flex gap-2 mt-4 pt-3 border-t border-[#F0F4F1]">
                    <button onClick={() => openModal('order', c.name)} className="flex-1 bg-[#2D6A4F] text-white py-1.5 rounded-lg text-xs font-semibold">Order</button>
                    <button onClick={() => openModal('payment', c.name)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 py-1.5 rounded-lg text-xs font-semibold">Payment</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function ModalWrapper({ children, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={onClose}>
          <div className="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden" onClick={e => e.stopPropagation()}>
            {children}
          </div>
        </div>
      );
    }

    function SeedModal({ onAdd, onClose }) {
      const [seedId, setSeedId] = useState('groundnut');
      const [quantity, setQuantity] = useState('');
      const [rate, setRate] = useState('');
      const [supplier, setSupplier] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        const seed = SEED_TYPES.find(s => s.id === seedId);
        onAdd({
          type: 'seed',
          seedId,
          details: `Inward: ${seed.name} from ${supplier || 'Market'}`,
          quantity: Number(quantity),
          unit: 'MT',
          rate: Number(rate),
          amount: Number(quantity) * Number(rate),
          date: new Date().toISOString().split('T')[0]
        });
      };

      return (
        <form onSubmit={handleSubmit} className="p-5 space-y-4">
          <div className="flex justify-between items-center border-b pb-2">
            <h3 className="font-bold text-sm text-[#1B2A22]">Add Raw Seed Stock</h3>
            <button type="button" onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark"></i></button>
          </div>
          <div className="space-y-3">
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Seed Variety</label>
              <select value={seedId} onChange={e => setSeedId(e.target.value)} className="w-full p-2.5 text-xs rounded-xl border border-gray-300">
                {SEED_TYPES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs font-semibold text-gray-600 block mb-1">Quantity (MT)</label>
                <input type="number" step="0.01" value={quantity} onChange={e => setQuantity(e.target.value)} required placeholder="e.g. 10" className="w-full p-2.5 text-xs rounded-xl border border-gray-300" />
              </div>
              <div>
                <label className="text-xs font-semibold text-gray-600 block mb-1">Rate / MT (₹)</label>
                <input type="number" value={rate} onChange={e => setRate(e.target.value)} placeholder="e.g. 65000" className="w-full p-2.5 text-xs rounded-xl border border-gray-300" />
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Supplier / Mandi</label>
              <input type="text" value={supplier} onChange={e => setSupplier(e.target.value)} placeholder="Supplier Name" className="w-full p-2.5 text-xs rounded-xl border border-gray-300" />
            </div>
          </div>
          <div className="flex gap-2 pt-2">
            <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl text-xs font-semibold bg-gray-100 text-gray-700">Cancel</button>
            <button type="submit" className="flex-1 py-2 rounded-xl text-xs font-semibold bg-[#2D6A4F] text-white">Save Inward</button>
          </div>
        </form>
      );
    }

    function CrushModal({ onAdd, onClose }) {
      const [seedId, setSeedId] = useState('groundnut');
      const [quantity, setQuantity] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        const seed = SEED_TYPES.find(s => s.id === seedId);
        const qty = Number(quantity);
        const oilProduced = (qty * (seed.yieldOil / 100)).toFixed(2);
        const cakeProduced = (qty * (seed.yieldCake / 100)).toFixed(2);

        onAdd({
          type: 'crush',
          seedId,
          details: `Crushed ${qty} MT ${seed.name} (Yield: ~${oilProduced} MT Oil, ~${cakeProduced} MT Cake)`,
          quantity: qty,
          unit: 'MT',
          date: new Date().toISOString().split('T')[0]
        });
      };

      return (
        <form onSubmit={handleSubmit} className="p-5 space-y-4">
          <div className="flex justify-between items-center border-b pb-2">
            <h3 className="font-bold text-sm text-[#1B2A22]">Log Crushing Batch</h3>
            <button type="button" onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark"></i></button>
          </div>
          <div className="space-y-3">
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Seed Variety to Crush</label>
              <select value={seedId} onChange={e => setSeedId(e.target.value)} className="w-full p-2.5 text-xs rounded-xl border border-gray-300">
                {SEED_TYPES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Quantity Crushed (MT)</label>
              <input type="number" step="0.01" value={quantity} onChange={e => setQuantity(e.target.value)} required placeholder="e.g. 5" className="w-full p-2.5 text-xs rounded-xl border border-gray-300" />
            </div>
          </div>
          <div className="flex gap-2 pt-2">
            <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl text-xs font-semibold bg-gray-100 text-gray-700">Cancel</button>
            <button type="submit" className="flex-1 py-2 rounded-xl text-xs font-semibold bg-[#2D6A4F] text-white">Record Crushing</button>
          </div>
        </form>
      );
    }

    function OrderModal({ customers, defaultCust, onAdd, onAddCust, onClose }) {
      const [customer, setCustomer] = useState(defaultCust || (customers[0] ? customers[0].name : ''));
      const [newCustName, setNewCustName] = useState('');
      const [product, setProduct] = useState(PRODUCT_OPTIONS[0].items[0]);
      const [quantity, setQuantity] = useState('');
      const [unit, setUnit] = useState('Litres (L)');
      const [rate, setRate] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        let targetCustomer = customer;
        if (customer === '__NEW__' || !customer) {
          if (!newCustName.trim()) return;
          targetCustomer = newCustName.trim();
          onAddCust({ id: Date.now().toString(), name: targetCustomer });
        }

        const total = Number(quantity) * Number(rate);
        onAdd({
          type: 'order',
          customer: targetCustomer,
          product,
          quantity: Number(quantity),
          unit,
          rate: Number(rate),
          totalAmount: total,
          details: `Order: ${product} (${quantity} ${unit}) for ${targetCustomer}`,
          date: new Date().toISOString().split('T')[0]
        });
      };

      return (
        <form onSubmit={handleSubmit} className="p-5 space-y-4 max-h-[90vh] overflow-y-auto">
          <div className="flex justify-between items-center border-b pb-2">
            <h3 className="font-bold text-sm text-[#1B2A22]">Create Sales Order</h3>
            <button type="button" onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark"></i></button>
          </div>
          <div className="space-y-3">
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Customer / Buyer</label>
              <select value={customer} onChange={e => setCustomer(e.target.value)} className="w-full p-2.5 text-xs rounded-xl border border-gray-300 mb-2">
                {customers.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                <option value="__NEW__">➕ Add New Customer Name...</option>
              </select>
              {(customer === '__NEW__' || customers.length === 0) && (
                <input type="text" placeholder="Enter New Customer Name" value={newCustName} onChange={e => setNewCustName(e.target.value)} required className="w-full p-2.5 text-xs rounded-xl border border-[#2D6A4F]" />
              )}
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Product Description</label>
              <select value={product} onChange={e => setProduct(e.target.value)} className="w-full p-2.5 text-xs rounded-xl border border-gray-300">
                {PRODUCT_OPTIONS.map(group => (
                  <optgroup key={group.group} label={group.group}>
                    {group.items.map(item => <option key={item} value={item}>{item}</option>)}
                  </optgroup>
                ))}
              </select>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs font-semibold text-gray-600 block mb-1">Quantity</label>
                <input type="number" step="any" value={quantity} onChange={e => setQuantity(e.target.value)} required placeholder="e.g. 50" className="w-full p-2.5 text-xs rounded-xl border border-gray-300" />
              </div>
              <div>
                <label className="text-xs font-semibold text-gray-600 block mb-1">Unit</label>
                <select value={unit} onChange={e => setUnit(e.target.value)} className="w-full p-2.5 text-xs rounded-xl border border-gray-300">
                  <option value="Litres (L)">Litres (L)</option>
                  <option value="Bottles">Bottles</option>
                  <option value="Bags (50Kg)">Bags (50Kg)</option>
                  <option value="Bags (25Kg)">Bags (25Kg)</option>
                  <option value="Metric Tons">Metric Tons</option>
                </select>
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Rate per Unit (₹)</label>
              <input type="number" step="any" value={rate} onChange={e => setRate(e.target.value)} required placeholder="e.g. 175" className="w-full p-2.5 text-xs rounded-xl border border-gray-300" />
            </div>
          </div>
          <div className="flex gap-2 pt-2">
            <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl text-xs font-semibold bg-gray-100 text-gray-700">Cancel</button>
            <button type="submit" className="flex-1 py-2 rounded-xl text-xs font-semibold bg-[#2D6A4F] text-white">Save Order</button>
          </div>
        </form>
      );
    }

    function PaymentModal({ customers, defaultCust, onAdd, onClose }) {
      const [customer, setCustomer] = useState(defaultCust || (customers[0] ? customers[0].name : ''));
      const [amount, setAmount] = useState('');
      const [mode, setMode] = useState('Bank Transfer / UPI');

      const handleSubmit = (e) => {
        e.preventDefault();
        onAdd({
          type: 'payment',
          customer,
          amount: Number(amount),
          details: `Payment received from ${customer} via ${mode}`,
          date: new Date().toISOString().split('T')[0]
        });
      };

      return (
        <form onSubmit={handleSubmit} className="p-5 space-y-4">
          <div className="flex justify-between items-center border-b pb-2">
            <h3 className="font-bold text-sm text-[#1B2A22]">Log Payment Received</h3>
            <button type="button" onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark"></i></button>
          </div>
          <div className="space-y-3">
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Customer</label>
              <select value={customer} onChange={e => setCustomer(e.target.value)} required className="w-full p-2.5 text-xs rounded-xl border border-gray-300">
                {customers.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Amount Received (₹)</label>
              <input type="number" value={amount} onChange={e => setAmount(e.target.value)} required placeholder="e.g. 25000" className="w-full p-2.5 text-xs rounded-xl border border-gray-300" />
            </div>
            <div>
              <label className="text-xs font-semibold text-gray-600 block mb-1">Payment Method</label>
              <select value={mode} onChange={e => setMode(e.target.value)} className="w-full p-2.5 text-xs rounded-xl border border-gray-300">
                <option value="Bank Transfer / UPI">Bank Transfer / UPI</option>
                <option value="Cash">Cash</option>
                <option value="Cheque">Cheque</option>
              </select>
            </div>
          </div>
          <div className="flex gap-2 pt-2">
            <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl text-xs font-semibold bg-gray-100 text-gray-700">Cancel</button>
            <button type="submit" className="flex-1 py-2 rounded-xl text-xs font-semibold bg-[#2D6A4F] text-white">Record Payment</button>
          </div>
        </form>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
